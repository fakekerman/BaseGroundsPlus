// Larger planets have deeper terrain subdivision and take longer to build the high-detail terrain colliders,
// and their terrain-detail differences (the cause of vessels sinking or popping out) are bigger.
// These only raise the *maximum* wait: vessels are still released as soon as the terrain under them is stable.

// Real Solar System (and RSS-based packs like RP-1 / Realism Overhaul)
@BASEGROUNDS_DEFAULTS:NEEDS[RealSolarSystem]:FOR[BaseGroundsPlus]
{
	@holdTimeout = 40
	@stableFrames = 30
	@maxLift = 50
	@anchorStaleDistance = 10
}

// Kerbal Star System / KSRSS and other 2.5x - 10x rescales (only if RSS itself is not installed)
@BASEGROUNDS_DEFAULTS:NEEDS[Kopernicus,!RealSolarSystem]:HAS[#holdTimeout[20]]:FOR[BaseGroundsPlus]
{
	@holdTimeout = 30
}
