// Compatibility fix (not part of the ground protection itself; delete this file to undo it).
//
// Realism Overhaul's KerbalFoundries (KSPWheel) patch for the LT-2 landing strut (landingLeg1-2) points the
// suspension and foot at "leg3_piston" / "leg3_foot", the transform names of an older ReStock model. The ReStock
// model in current versions calls them "piston" and "foot". With the old names KSPWheelBogey throws a
// NullReferenceException every frame for every LT-2 that is deployed and touching the ground, which floods KSP.log
// (tens of thousands of errors) and makes the whole game, UI included, stutter.
//
// Only applied when the old names are present, so it does nothing once RO / ReStock fix it themselves.
@PART[landingLeg1-2]:NEEDS[ReStock,KSPWheel,RealismOverhaul]:AFTER[RealismOverhaul]
{
	@MODULE[KSPWheelSuspension]:HAS[#suspensionName[leg3_piston]]
	{
		@suspensionName = piston
	}
	@MODULE[KSPWheelBogey]:HAS[#bogeyName[leg3_foot]]
	{
		@bogeyName = foot
	}
}
