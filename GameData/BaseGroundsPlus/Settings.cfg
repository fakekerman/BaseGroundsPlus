// BaseGrounds+ default settings.
// Your own changes from the in-game Settings page are saved to PluginData/settings.cfg and win over these.
// Planet packs can adjust these with ModuleManager (see Patches/PlanetPacks.cfg).
BASEGROUNDS_DEFAULTS
{
	enabled = true
	protectAllLanded = true      // protect every landed vessel, not just the ones you mark
	showMessages = true
	debugLogging = false

	// HOLD: keep a landed vessel on rails until the terrain colliders under it stop changing
	holdTimeout = 20             // seconds; release anyway after this long
	minHoldTime = 0.4
	stableFrames = 25            // physics frames the ground height must stay the same
	stableTolerance = 0.02       // metres

	// RELEASE: lift the vessel out of the ground before physics starts
	maxLift = 25                 // metres
	liftMargin = 0.03            // metres of clearance after a lift

	// SETTLE: the first seconds of physics
	settleTime = 4               // seconds
	settleMaxSpeed = 1.5         // m/s relative to the ground
	settleMaxAngular = 0.6       // rad/s
	depenetrationSpeed = 1       // m/s, how fast PhysX may push parts out of the ground

	// GUARD: protected landed vessels you are not flying
	guardSpeed = 6               // m/s; a sudden jump above this is treated as a kraken impulse

	// ANCHOR
	anchorStaleDistance = 5      // metres; if a mod moved the vessel further than this while unloaded, re-anchor there

	// what ticking "Base" also does
	baseDefaultAnchor = true
	baseDefaultStatic = false
	baseSetsVesselType = true
}
